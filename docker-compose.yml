services:
  api:
    build: .
    image: tienda-api:1.0.0
    container_name: tienda-api
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    image: tienda-frontend:1.0.0
    container_name: tienda-frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
