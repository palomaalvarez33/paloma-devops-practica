<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda online</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    section { border: 1px solid #ccc; border-radius: 6px; padding: 12px 16px; margin: 16px 0; }
    h2 { margin-top: 0; font-size: 1.1rem; }
    label { display: inline-block; margin: 4px 8px 4px 0; }
    input, select, button { padding: 5px 8px; font-size: 0.95rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: left; font-size: 0.9rem; }
    th { background: #f3f3f3; }
    #mensaje { padding: 8px 12px; border-radius: 4px; display: none; }
    #mensaje.ok { background: #e3f5e3; display: block; }
    #mensaje.error { background: #fbe3e3; display: block; }
  </style>
</head>
<body>
  <h1>Tienda online</h1>

  <!-- Dirección de la API: se puede cambiar para probar contra otro equipo (http://IP:8000) -->
  <label>URL de la API:
    <input id="baseUrl" type="text" value="http://localhost:8000" size="30">
  </label>
  <div id="mensaje"></div>

  <section>
    <h2>Productos</h2>
    <button onclick="cargarProductos()">Actualizar lista</button>
    <table>
      <thead><tr><th>ID</th><th>Tipo</th><th>Nombre</th><th>Precio</th><th>Stock</th><th>Detalles</th></tr></thead>
      <tbody id="tablaProductos"></tbody>
    </table>
  </section>

  <section>
    <h2>Crear producto</h2>
    <label>Tipo
      <select id="pTipo" onchange="mostrarCamposTipo()">
        <option value="generico">Genérico</option>
        <option value="electronico">Electrónico</option>
        <option value="ropa">Ropa</option>
      </select>
    </label>
    <label>Nombre <input id="pNombre"></label>
    <label>Precio <input id="pPrecio" type="number" step="0.01" min="0" style="width:80px"></label>
    <label>Stock <input id="pStock" type="number" min="0" style="width:70px"></label>
    <span id="camposElectronico" style="display:none">
      <label>Meses garantía <input id="pGarantia" type="number" min="0" style="width:70px"></label>
    </span>
    <span id="camposRopa" style="display:none">
      <label>Talla <input id="pTalla" style="width:60px"></label>
      <label>Color <input id="pColor" style="width:90px"></label>
    </span>
    <button onclick="crearProducto()">Crear</button>
  </section>

  <section>
    <h2>Usuarios</h2>
    <button onclick="cargarUsuarios()">Actualizar lista</button>
    <table>
      <thead><tr><th>ID</th><th>Nombre</th><th>Email</th><th>Administrador</th></tr></thead>
      <tbody id="tablaUsuarios"></tbody>
    </table>
  </section>

  <section>
    <h2>Crear pedido</h2>
    <label>Cliente <select id="oCliente"></select></label><br>
    <label>Producto <select id="oProducto"></select></label>
    <label>Cantidad <input id="oCantidad" type="number" min="1" value="1" style="width:70px"></label>
    <button onclick="anadirLinea()">Añadir línea</button>
    <ul id="listaLineas"></ul>
    <button onclick="crearPedido()">Crear pedido</button>
  </section>

  <section>
    <h2>Pedidos de un usuario</h2>
    <label>Usuario <select id="qCliente"></select></label>
    <button onclick="consultarPedidos()">Consultar</button>
    <table>
      <thead><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Líneas</th></tr></thead>
      <tbody id="tablaPedidos"></tbody>
    </table>
  </section>

<script>
  // ==================================================================
  //  COMUNICACIÓN CON LA API
  //  Todas las peticiones HTTP pasan por esta función (fetch).
  //  Recibe método, ruta y cuerpo opcional (JSON), comprueba el código
  //  de estado (response.ok) y devuelve el JSON de la respuesta.
  // ==================================================================
  async function api(metodo, ruta, cuerpo) {
    const baseUrl = document.getElementById("baseUrl").value.replace(/\/$/, "");
    const opciones = { method: metodo, headers: {} };
    if (cuerpo !== undefined) {
      opciones.headers["Content-Type"] = "application/json";
      opciones.body = JSON.stringify(cuerpo);
    }
    const respuesta = await fetch(baseUrl + ruta, opciones);   // <-- petición HTTP
    if (!respuesta.ok) {                                        // <-- comprobación del código de estado
      let detalle = respuesta.statusText;
      try {
        const datos = await respuesta.json();
        detalle = typeof datos.detail === "string" ? datos.detail : JSON.stringify(datos.detail);
      } catch (e) {}
      throw new Error(`Error ${respuesta.status}: ${detalle}`);
    }
    return respuesta.status === 204 ? null : respuesta.json(); // <-- procesado de la respuesta JSON
  }

  function mostrar(texto, esError) {
    const m = document.getElementById("mensaje");
    m.textContent = texto;
    m.className = esError ? "error" : "ok";
  }

  async function ejecutar(accion) {
    try { await accion(); } catch (e) { mostrar(e.message || "No se pudo conectar con la API", true); }
  }

  // ---------------- Productos ----------------
  // GET /productos
  function cargarProductos() {
    return ejecutar(async () => {
      const productos = await api("GET", "/productos");
      document.getElementById("tablaProductos").innerHTML = productos.map(p => {
        let detalles = "";
        if (p.meses_garantia !== null) detalles = `Garantía: ${p.meses_garantia} meses`;
        if (p.talla) detalles = `Talla ${p.talla}, color ${p.color}`;
        return `<tr><td>${p.id}</td><td>${p.tipo}</td><td>${p.nombre}</td><td>${p.precio}</td><td>${p.stock}</td><td>${detalles}</td></tr>`;
      }).join("");
      document.getElementById("oProducto").innerHTML =
        productos.map(p => `<option value="${p.id}">${p.nombre} (stock ${p.stock})</option>`).join("");
    });
  }

  function mostrarCamposTipo() {
    const tipo = document.getElementById("pTipo").value;
    document.getElementById("camposElectronico").style.display = tipo === "electronico" ? "inline" : "none";
    document.getElementById("camposRopa").style.display = tipo === "ropa" ? "inline" : "none";
  }

  // POST /productos
  function crearProducto() {
    return ejecutar(async () => {
      const tipo = document.getElementById("pTipo").value;
      const producto = {
        tipo: tipo,
        nombre: document.getElementById("pNombre").value,
        precio: parseFloat(document.getElementById("pPrecio").value),
        stock: parseInt(document.getElementById("pStock").value),
      };
      if (tipo === "electronico") producto.meses_garantia = parseInt(document.getElementById("pGarantia").value);
      if (tipo === "ropa") {
        producto.talla = document.getElementById("pTalla").value;
        producto.color = document.getElementById("pColor").value;
      }
      const creado = await api("POST", "/productos", producto);
      mostrar(`Producto creado con id ${creado.id}`, false);
      await cargarProductos();
    });
  }

  // ---------------- Usuarios ----------------
  // GET /usuarios
  function cargarUsuarios() {
    return ejecutar(async () => {
      const usuarios = await api("GET", "/usuarios");
      document.getElementById("tablaUsuarios").innerHTML = usuarios.map(u =>
        `<tr><td>${u.id}</td><td>${u.nombre}</td><td>${u.email}</td><td>${u.es_admin ? "Sí" : "No"}</td></tr>`
      ).join("");
      const opciones = usuarios.map(u => `<option value="${u.id}">${u.id} - ${u.nombre}</option>`).join("");
      document.getElementById("oCliente").innerHTML = opciones;
      document.getElementById("qCliente").innerHTML = opciones;
    });
  }

  // ---------------- Pedidos ----------------
  let lineas = [];   // líneas del pedido en preparación

  function anadirLinea() {
    const select = document.getElementById("oProducto");
    if (!select.value) { mostrar("No hay productos disponibles", true); return; }
    lineas.push({
      producto_id: parseInt(select.value),
      cantidad: parseInt(document.getElementById("oCantidad").value),
      nombre: select.options[select.selectedIndex].text,
    });
    document.getElementById("listaLineas").innerHTML =
      lineas.map(l => `<li>${l.nombre} x ${l.cantidad}</li>`).join("");
  }

  // POST /pedidos
  function crearPedido() {
    return ejecutar(async () => {
      const clienteId = parseInt(document.getElementById("oCliente").value);
      if (!clienteId || lineas.length === 0) { mostrar("Elige un cliente y añade al menos una línea", true); return; }
      const pedido = await api("POST", "/pedidos", {
        cliente_id: clienteId,
        items: lineas.map(l => ({ producto_id: l.producto_id, cantidad: l.cantidad })),
      });
      mostrar(`Pedido ${pedido.id} creado. Total: ${pedido.total}`, false);
      lineas = [];
      document.getElementById("listaLineas").innerHTML = "";
      await cargarProductos();   // el stock ha cambiado
    });
  }

  // GET /usuarios/{cliente_id}/pedidos
  function consultarPedidos() {
    return ejecutar(async () => {
      const id = document.getElementById("qCliente").value;
      if (!id) { mostrar("Elige un usuario", true); return; }
      const pedidos = await api("GET", `/usuarios/${id}/pedidos`);
      document.getElementById("tablaPedidos").innerHTML = pedidos.map(p =>
        `<tr><td>${p.id}</td><td>${new Date(p.fecha).toLocaleString()}</td><td>${p.total}</td>` +
        `<td>${p.items.map(i => `${i.nombre} x ${i.cantidad}`).join(", ")}</td></tr>`
      ).join("");
      mostrar(`${pedidos.length} pedido(s) encontrados`, false);
    });
  }

  // Carga inicial
  cargarProductos();
  cargarUsuarios();
</script>
</body>
</html>
